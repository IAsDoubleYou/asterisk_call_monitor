name: Attach the release zip

# Runs when a release is published, whether that happens through the web UI
# after tagging or through the API. Tagging and publishing stay a manual,
# human decision; this only builds and attaches the asset that HACS installs
# from (hacs.json sets zip_release) and that the downloads badge counts.
on:
  release:
    types: [published]

jobs:
  attach-zip:
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - uses: "actions/checkout@v5"
      - name: Build homeassistant-asterisk_call_monitor.zip
        # Zipped from inside the component directory, so the archive holds
        # manifest.json and the rest directly at its root instead of nested
        # one level too deep under an extra asterisk_call_monitor/ folder.
        run: |
          cd custom_components/asterisk_call_monitor
          zip -r "$GITHUB_WORKSPACE/homeassistant-asterisk_call_monitor.zip" .
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            homeassistant-asterisk_call_monitor.zip \
            --repo "${{ github.repository }}" \
            --clobber
